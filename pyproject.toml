[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkcheck"
version = "1.0.0"
description = "Find broken links in Markdown docs: HTTP checks, local-file and anchor validation, concurrent, zero-dependency"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Subhan Malik"}]

[project.scripts]
linkcheck = "linkcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
